version: 3
systemUnderTest:
  service:
    definitions:
    - definition:
        source:
          filesystem:
            directory: ../../../spec
        specs:
        - spec:
            id: placeOrderArazzoSpec
            path: ./arazzo/PlaceOrder.arazzo.yaml
    runOptions:
      arazzo:
        type: test
        specs:
        - spec:
            id: placeOrderArazzoSpec
            vault:
              profiles:
                commerceVault:
                  type: hashicorp
                  url: http://vault-commerce:8200
                  mount: secret
                  tokenKey: COMMERCE_VAULT_TOKEN
                  version: 2
                identityVault:
                  type: hashicorp
                  url: http://vault-identity:8200
                  mount: secret
                  tokenKey: IDENTITY_VAULT_TOKEN
                  version: 2
              bindings:
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: getLocation
                  use: commerceVault
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: getProducts
                  use: commerceVault
              - binding:
                  when:
                    source: OrdersApi
                    workflow: PlaceOrder
                  use: commerceVault
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: reserveInventory
                  use: identityVault
            security:
              profiles:
                apiMtls:
                  mtls:
                    keyStore:
                      file: ../../../certs/specmatic-client.jks
                      alias: specmatic-client
                      password: changeit
                    keyStorePassword: changeit
                locationStaticBearer:
                  extends: apiMtls
                  bearer:
                    vault:
                      secretKey: commerce
                      field: /location_bearer_token
                productsPasswordGrant:
                  extends: apiMtls
                  oauth2:
                    grantType: password
                    tokenUrl: http://keycloak-commerce:8080/realms/commerce/protocol/openid-connect/token
                    clientAuthentication: none
                    clientId:
                      vault:
                        secretKey: commerce
                        field: /products_client_id
                    username:
                      vault:
                        secretKey: commerce
                        field: /products_username
                    password:
                      vault:
                        secretKey: commerce
                        field: /products_password
                ordersClientCredentialsBasic:
                  extends: apiMtls
                  oauth2:
                    grantType: client_credentials
                    tokenUrl: http://keycloak-commerce:8080/realms/commerce/protocol/openid-connect/token
                    clientAuthentication: client_secret_basic
                    clientId:
                      vault:
                        secretKey: commerce
                        field: /orders_client_id
                    clientSecret:
                      vault:
                        secretKey: commerce
                        field: /orders_client_secret
                inventoryJwtOauth:
                  extends: apiMtls
                  oauth2:
                    grantType: urn:ietf:params:oauth:grant-type:jwt-bearer
                    tokenUrl: http://keycloak-inventory:8080/realms/inventory/protocol/openid-connect/token
                    clientAuthentication: private_key_jwt
                    clientId:
                      env: INVENTORY_CLIENT_ID
                    privateKey:
                      vault:
                        secretKey: inventory
                        field: /client_private_key
                    signingAlgorithm: RS256
                    keyId: inventory-client-auth-key
                    clientAssertionAudience: http://localhost:9001/realms/inventory
                    grantAssertion:
                      issuer: https://inventory-grant-issuer.example.test
                      subject: inventory-demo-subject
                      audience: http://localhost:9001/realms/inventory
                      privateKey:
                        vault:
                          secretKey: inventory
                          field: /grant_private_key
                      signingAlgorithm: RS256
                      keyId: inventory-grant-key
              bindings:
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: getLocation
                  use: locationStaticBearer
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: getProducts
                  use: productsPasswordGrant
              - binding:
                  when:
                    source: OrdersApi
                    workflow: PlaceOrder
                  use: ordersClientCredentialsBasic
              - binding:
                  when:
                    workflow: PlaceOrder
                    step: reserveInventory
                  use: inventoryJwtOauth
            baseUrls:
              LocationApi: https://location:8000
              ProductsApi: https://products:8000
              OrdersApi: https://orders:8000
              InventoryApi: https://inventory:8000
