version: 3
systemUnderTest:
  service:
    $ref: "#/components/services/products"
    runOptions:
      $ref: "#/components/runOptions/productsTest"
    data:
      examples:
        - directories: [examples]
specmatic:
  settings:
    test:
      strictMode: true
  governance:
    successCriteria:
      minCoveragePercentage: 100
      maxMissedOperationsInSpec: 0
      enforce: true
components:
  services:
    products:
      description: Products API provider contract suite
      definitions:
        - definition:
            source:
              filesystem:
                directory: ../../../
            specs: [spec/openapi/products.yaml]
  runOptions:
    productsTest:
      openapi:
        type: test
        baseUrl: https://products:8000
        cert:
          keyStore:
            file: ../../../certs/specmatic-client.jks
            alias: specmatic-client
            password: changeit
          keyStorePassword: changeit
