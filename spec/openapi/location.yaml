openapi: 3.0.3
info:
  title: User Location API
  description: Looks up a user's location by email address.
  version: 1.0.0
servers:
  - url: https://localhost:8001
paths:
  /location:
    get:
      operationId: getLocation
      summary: Get a user's location
      parameters:
        - name: userEmail
          in: query
          required: true
          schema:
            type: string
            format: email
      security:
        - bearerAuth: []
      responses:
        "200":
          description: User location found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Location"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Static bearer token stored in the Commerce Vault.
  schemas:
    Location:
      type: object
      required: [userId, locationCode]
      properties:
        userId:
          type: integer
        locationCode:
          type: string
          example: IND-BLR
    Error:
      type: object
      required: [message]
      properties:
        message:
          type: string
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: User was not found
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
