[project]
name = "specmatic-arazzo-auth"
version = "0.1.0"
description = "Authentication-focused Specmatic OpenAPI sample"
requires-python = ">=3.13,<3.14"
dependencies = [
    "fastapi[standard]==0.122.0",
    "psycopg2-binary==2.9.11",
    "PyJWT[crypto]==2.10.1",
    "pydantic-settings==2.12.0",
    "requests==2.32.5",
    "sqlmodel==0.0.27",
]

[dependency-groups]
dev = [
    "pytest==8.4.2",
    "ruff>=0.17.3",
    "testcontainers==4.12.0",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["B", "E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"common/auth/access_tokens.py" = ["B008"]
"services/**/*.py" = ["B008"]

[tool.uv]
package = false
required-version = ">=0.11.6,<0.14.0"
